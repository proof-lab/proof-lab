[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prooflab"
version = "0.1.0"
description = "A research-first quantitative trading platform."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Proof Lab" }]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "joblib>=1.3",
    "pyarrow>=14.0",
    "duckdb>=0.10",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "torch>=2.2",
    "optuna>=3.5",
]

dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[project.scripts]
prooflab = "prooflab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = [
    "N818",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["^tests/", "^notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: unit tests (fast, no external dependencies)",
    "integration: integration tests (may require external services)",
    "regression: regression tests",
    "property: property-based tests",
]

[tool.coverage.run]
source = ["src/prooflab"]
omit = ["**/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80