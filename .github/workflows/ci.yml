name: CI

on:
  push:
    branches:
      - development
      - staging
      - production
      - "feat/**"
  pull_request:
    branches:
      - development
      - staging
      - production

jobs:
  # -------------------------------------------------------------------------
  # Lint
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

  # -------------------------------------------------------------------------
  # Type-check
  # -------------------------------------------------------------------------
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install development and model dependencies
        run: pip install -e ".[dev,ml]"

      - name: Run mypy
        run: mypy src/

  # -------------------------------------------------------------------------
  # Unit tests
  # -------------------------------------------------------------------------
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        extras: ["dev", "dev,ml"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU PyTorch
        if: matrix.extras == 'dev,ml'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -e ".[${{ matrix.extras }}]"

      - name: Verify model dependencies are importable
        if: matrix.extras == 'dev,ml'
        run: python -c "import sklearn, xgboost, torch"

      - name: Run core unit tests
        if: matrix.extras == 'dev'
        run: pytest tests/unit/ -q

      - name: Run unit tests with coverage
        if: matrix.extras == 'dev,ml'
        run: pytest tests/unit/ -v --cov=prooflab --cov-report=term-missing
